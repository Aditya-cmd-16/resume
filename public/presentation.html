<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ResumeAI — Project Presentation & Slide Deck</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #040913;
      --card-bg: #081a2e;
      --card-border: #1a3854;
      --text: #f0f8ff;
      --muted: #9bb0c7;
      --cyan: #4fe4f7;
      --green: #6ee7b7;
      --purple: #a78bfa;
      --orange: #fbbf24;
      --red: #f87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* Top Control Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px;
      background: rgba(6, 15, 27, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #142d45;
      z-index: 10;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
    }
    .logo-badge {
      background: linear-gradient(135deg, #10b981, #06b6d4);
      color: #021815;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 800;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: #0d2842;
      border: 1px solid #234c70;
      color: var(--text);
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .btn:hover {
      background: #143b60;
      border-color: var(--cyan);
      color: #fff;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #10b981);
      border: 0;
      color: #021316;
      font-weight: 700;
    }
    .btn-primary:hover {
      opacity: 0.92;
      box-shadow: 0 0 20px rgba(79, 228, 247, 0.4);
    }

    /* Main Slide Stage */
    main {
      flex: 1;
      display: grid;
      place-items: center;
      padding: 24px;
      position: relative;
    }
    .slide-viewport {
      width: min(1200px, 94vw);
      height: min(675px, 80vh);
      background: linear-gradient(145deg, #091c30, #050f1c);
      border: 1px solid #1f4263;
      border-radius: 20px;
      box-shadow: 0 30px 90px rgba(0,0,0,0.85), 0 0 35px rgba(79, 228, 247, 0.1);
      padding: 48px 56px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* Slide Elements */
    .eyebrow {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.5px;
      color: var(--cyan);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .slide-title {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 24px;
      color: #fff;
    }
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Layout Grids */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
    }
    .card h3 { font-size: 17px; margin-bottom: 8px; color: #fff; }
    .card p { font-size: 13px; color: var(--muted); line-height: 1.6; }
    .card ul { list-style: none; margin-top: 10px; display: grid; gap: 8px; }
    .card li { font-size: 12.5px; color: #c4d7ea; display: flex; gap: 8px; line-height: 1.45; }
    .card li::before { content: "•"; color: var(--cyan); font-weight: bold; }

    .stat-pill {
      font-size: 28px;
      font-weight: 800;
      color: var(--cyan);
      margin-bottom: 4px;
    }

    /* Comparison Box */
    .compare-box {
      background: #030a14;
      border: 1px solid #1a3652;
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 14px;
    }
    .compare-box b { display: block; font-size: 11px; letter-spacing: 1px; margin-bottom: 4px; }

    /* Footer / Progress Bar */
    footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 28px;
      background: rgba(4, 9, 19, 0.9);
      border-top: 1px solid #12283e;
    }
    .progress-track {
      flex: 1;
      max-width: 400px;
      height: 6px;
      background: #0d2238;
      border-radius: 4px;
      overflow: hidden;
      margin: 0 20px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #0ea5e9, #10b981);
      width: 8%;
      transition: width 0.3s ease;
    }
    .nav-controls {
      display: flex;
      gap: 8px;
    }

    /* Slide transition */
    .slide-content {
      animation: fadeIn 0.25s ease-out;
      height: 100%;
      display: flex;
      flex-direction: column;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media print {
      body { overflow: visible; background: #fff; color: #000; }
      header, footer, .nav-controls { display: none; }
      .slide-viewport { page-break-after: always; width: 100%; height: 100vh; box-shadow: none; border: 0; }
    }
  </style>
</head>

    let currentSlide = 0

    function renderSlide(idx) {
      const slide = slides[idx]
      const container = document.getElementById('slideContainer')
      container.innerHTML = `
        <div class="slide-content">
          <div>
            <p class="eyebrow">${slide.eyebrow}</p>
            <h1 class="slide-title">${slide.title}</h1>
          </div>
          <div class="slide-body">
            ${slide.render()}
          </div>
        </div>
      `
      document.getElementById('slideIndicator').textContent = `Slide ${idx + 1} / ${slides.length}`
      document.getElementById('progressBar').style.width = `${((idx + 1) / slides.length) * 100}%`
    }

    function nextSlide() {
      if (currentSlide < slides.length - 1) {
        currentSlide++
        renderSlide(currentSlide)
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        currentSlide--
        renderSlide(currentSlide)
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen()
      } else {
        document.exitFullscreen()
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        nextSlide()
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        prevSlide()
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen()
      }
    })

    renderSlide(0)
  </script>
